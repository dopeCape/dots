# Emerald Matrix - A green accent theme for Kitty terminal

# The basic colors
# The basic colors
foreground            #ffffff
background            #181616
selection_foreground  #c5c9c5
selection_background  #0d0c0c

# Cursor colors
cursor                #b98d7b
cursor_text_color     #c5c9c5

# URL underline color when hovering
# No direct equivalent in your palette, using a shade from the 'red' or 'green' family for visibility.
url_color             #c4746e

# Window border colors
# No direct equivalent in your palette, using a shade that contrasts well.
active_border_color   #87a987
inactive_border_color #282727

# Tab bar colors
# No direct equivalent for active/inactive tab foreground/background in your palette.
# Using a contrasting setup based on foreground/background and one of the palette colors.
active_tab_foreground   #181616
active_tab_background   #87a987
inactive_tab_foreground #ffffff
inactive_tab_background #282727

# The 16 terminal colors

# black
color0   #12120f
color8   #282727

# red
color1   #c4746e
color9   #c4746e

# green
color2   #87a987
color10  #8a9a7b

# yellow
color3   #c4b28a
color11  #b6927b

# blue
color4   #8ba4b0
color12  #949fb5

# magenta
color5   #a292a3
color13  #a292a3

# cyan
color6   #8ea4a2
color14  #8ea4a2

# white
color7   #9e9b93
color15  #a6a69c

# Marks
# No direct equivalent in your palette, using similar logic as tab colors.
mark1_foreground #181616
mark1_background #87a987
mark2_foreground #181616
mark2_background #8ea4a2
mark3_foreground #181616
mark3_background #c4b28a

# Hints
# No direct equivalent in your palette, using similar logic as tab colors.
hint_foreground #181616
hint_background #87a987


# BEGIN_KITTY_FONTS
font_family      family="Hack"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
